<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Logger</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    button { font-size: 16px; padding: 10px 20px; margin-right: 10px; margin-bottom: 10px; }
    #log { background: #f0f0f0; padding: 10px; height: 300px; overflow-y: scroll; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>GPS Logger</h1>
  <button id="startBtn">記録開始</button>
  <button id="stopBtn" disabled>停止</button>
  <button id="downloadBtn">CSVダウンロード</button>
  <button id="clearBtn">ログ消去</button>

  <h3>位置情報ログ</h3>
  <div id="log"></div>

  <script>
    let watchId = null;
    let gpsData = [];

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const logDiv = document.getElementById('log');

    // ログ表示更新関数
    function appendLog(msg) {
      const time = new Date().toLocaleTimeString();
      logDiv.textContent = `[${time}] ${msg}\n` + logDiv.textContent;
    }

    // GPS記録開始
    startBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("お使いのブラウザはGPSをサポートしていません。");
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const time = new Date(pos.timestamp).toLocaleString();
          
          gpsData.push({ time, lat, lng });
          appendLog(`取得成功: 緯度=${lat}, 経度=${lng}`);
        },
        (err) => {
          appendLog(`エラー (${err.code}): ${err.message}`);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );

      startBtn.disabled = true;
      stopBtn.disabled = false;
      appendLog("記録を開始しました...");
    });

    // 停止
    stopBtn.addEventListener('click', () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      appendLog("記録を停止しました。");
    });

    // CSVダウンロード
    downloadBtn.addEventListener('click', () => {
      if (gpsData.length === 0) {
        alert("保存するデータがありません。");
        return;
      }
      let csv = "日時,緯度,経度\n";
      gpsData.forEach(row => {
        csv += `"${row.time}",${row.lat},${row.lng}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gps_log_${Date.now()}.csv`;
      a.click();
    });

    // クリア
    clearBtn.addEventListener('click', () => {
      if (confirm("ログを消去しますか？")) {
        gpsData = [];
        logDiv.textContent = "";
        appendLog("ログをクリアしました。");
      }
    });
  </script>
</body>
</html>
